apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-api-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RahulSolanki007/k8s-sample-app.git
    targetRevision: main
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: node-api-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
